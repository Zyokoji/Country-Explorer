    <link rel="stylesheet" href="style.css" />
  </head>

      <nav>

        <p>Email me at <a href="mailto:hello@example.com">hello@example.com</a>.</p>

    <footer>
      <p>&copy; 2026 My Simple Page</p>
    </footer>

</html>
